name: code-quality

on:
  push:
    paths: ['**.php', 'phpstan.neon.dist', 'pint.json', '.github/workflows/code-quality.yml']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --prefer-stable --prefer-dist --no-interaction
      - run: vendor/bin/phpstan analyse --error-format=github --memory-limit=1G

  pint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --prefer-stable --prefer-dist --no-interaction
      - run: vendor/bin/pint --test

  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Fail if compiled assets are out of date
        run: git diff --exit-code resources/dist
